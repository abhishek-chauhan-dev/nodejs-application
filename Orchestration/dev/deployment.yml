apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-deployment
  labels:
    app: node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      containers:
      - name: node
        image: abhishekchauhandev/node-app:d016c25bd7f9c40df6c870ebb6d25e0f5073b441
        ports:
        - containerPort: 8080
        