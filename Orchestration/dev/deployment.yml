apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-deployment
  labels:
    app: node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node
  template:
    metadata:
      labels:
        app: node
    spec:
      containers:
      - name: node
        image: abhishekchauhandev/node-app:c627925c404102c2be36c2e3de4c3c2a96c081ba
        ports:
        - containerPort: 8080
        