name: Continuous Integration Pipeline

on:
  push:
    branches:
      - feat/gitops
    
jobs:

  build_and_push:
    
    runs-on: ubuntu-latest

    steps:    
      - name: Code Checkout
        uses: actions/checkout@v7
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/node-app:${{ github.sha }}
      
      - name: update image
        shell: bash
        run: |
          echo "Updating image in deployment.yaml"

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git clone https://${{ secrets.IMAGE_UPDATE_TOKEN }}@github.com/${{ github.repository_owner }}/Kubernetes.git

          cd Kubernetes/Orchestration/dev

          sed -i "s|image: ghcr.io/${{ github.repository_owner }}/node-app:.*|image: ghcr.io/${{ github.repository_owner }}/node-app:${{ github.sha }}|g" deployment.yml

          cat deployment.yml

          git add deployment.yml
          
          git commit -m "Update image with tag ${{ github.sha }}"

          git push https://${{ secrets.IMAGE_UPDATE_TOKEN }}@github.com/${{ github.repository_owner }}/Kubernetes.git main

