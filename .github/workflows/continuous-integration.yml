name: Continuous Integration Pipeline

on:
  push:
    branches:
      - master
    
jobs:

  build_and_push:
    
    runs-on: ubuntu-latest

    steps:    
      - name: Code Checkout
        uses: actions/checkout@v7
      
      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/node-app:${{ github.sha }}

  update_image_and_push:
  
    needs: 
      - build_and_push

    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Update image tag in Kubernetes deployment file
        run: |
          sed -i "s|image:.*|image: abhishekchauhandev/node-app:${{ github.sha }}|" Orchestration/dev/deployment.yml

      - name: push the image tag to github repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add Orchestration/dev/deployment.yml
          git commit -m "Successfully updated image tag in the deployment.yml file."
          git remote set-url origin https://${{ secrets.REPO_TOKEN }}@github.com/abhishek-chauhan-dev/nodejs-application.git
          git push origin master